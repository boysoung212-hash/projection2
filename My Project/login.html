<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Travel Guides Website</title>
    <meta name="description" content="Login to the Travel Guides Website.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
    <main class="header">
        <section class="login-panel" aria-labelledby="loginTitle">
            <h1 class="login-title" id="loginTitle">Login</h1>

            <form class="login-form" action="#" method="post">
                <label class="sr-only" for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>

                <label class="sr-only" for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>

                <div class="form-meta">
                    <label class="remember-toggle" for="remember">
                        <input id="remember" name="remember" type="checkbox" checked>
                        <span class="remember-toggle__box" aria-hidden="true">
                            <svg viewBox="0 0 24 24" role="img" focusable="false">
                                <path d="M5 13.2 9.3 17.5 19 7.8"></path>
                            </svg>
                        </span>
                        <span>Remember me</span>
                    </label>
                    <a class="forgot-link" href="#">Forgot Password?</a>
                </div>

                <button class="primary-button" type="submit">Log in</button>
            </form>

            <p class="signup-copy">
                Don't have an account?
                <a href="register.html">Sign up</a>
            </p>

            <div class="divider" aria-hidden="true"><span>or</span></div>

            <div class="social-stack">
                <button class="social-button social-button--facebook" type="button">Continue with Facebook</button>
                <button class="social-button social-button--google" type="button">Continue with Google</button>
                <button class="social-button social-button--apple" type="button">Continue with Apple</button>
            </div>

            <a class="back-link" href="index.html">Back to website</a>
        </section>
    </main>
</body>
</html>
